# Config do mypy. As dependências continuam em requirements.txt.
[mypy]
python_version = 3.11
# main.py/add_documents.py importam `src.rag_agent`; os imports internos do
# pacote são todos relativos, então checar por esse nome cobre tudo.
files = main.py, add_documents.py
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
