# RAG Agentic System Configuration

# Embedding configuration
embeddings:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  device: null  # null for auto-detect, "cpu" or "cuda"
  use_tfidf_fallback: true  # Use TF-IDF if sentence-transformers not available
  vector_dimension: 384

# Vector store configuration
vector_store:
  backend: "simple"  # Currently only "simple" is supported
  embedding_dimension: 384
  similarity_metric: "cosine"
  top_k: 5  # Number of documents to retrieve by default

# Document retrieval configuration
retrieval:
  sources:
    - "data/processed"  # Directory to scan for documents
  file_extensions:
    - ".txt"
    - ".md"
  chunk_size: 512  # Maximum words per chunk
  chunk_overlap: 64  # Words of overlap between chunks

# Memory configuration
memory:
  enabled: true
  database_path: "data/memory.db"
  cleanup_days: 30  # Delete logs older than this
  importance_threshold: 0.3

# Verification configuration
verification:
  enabled: true
  factual_checks: true
  consistency_checks: true
  min_confidence: 0.55

# Agent configuration
agent:
  max_iterations: 6
  retry_attempts: 2
  # Only the OpenAI-compatible backend uses this. Sampling parameters were
  # removed on Claude Opus 4.7+ and a request carrying one is rejected.
  temperature: 0.2
  reasoning_steps: 3

# LLM configuration for the agent loop
llm:
  # null/auto = Claude when its key is available, else an OpenAI-compatible
  # endpoint when one is configured, else the offline scripted model.
  # "anthropic" = always Claude; "openai" = always OpenAI-compatible;
  # "scripted" = always offline.
  provider: null
  # Leave null to use each backend's own default (claude-opus-5 / gpt-4.1-mini).
  model: null
  max_tokens: 1024
  # Credentials come from the environment (or .env):
  #   Anthropic          ANTHROPIC_API_KEY
  #   OpenAI             OPENAI_API_KEY
  #   OpenRouter/Groq/…  RAG_LLM_BASE_URL + RAG_LLM_API_KEY
  #   Ollama/LM Studio   RAG_LLM_BASE_URL only (no credential needed)