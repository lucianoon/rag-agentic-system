name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # openai entra aqui para a CI exercitar de fato a seleção de
          # backend e a tradução de tool calls; nenhum teste faz rede.
          pip install numpy scikit-learn pyyaml pytest openai

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run tests
        run: pytest -q
