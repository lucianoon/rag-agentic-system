name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # openai entra aqui para a CI exercitar de fato a seleção de
          # backend e a tradução de tool calls; nenhum teste faz rede.
          pip install -r requirements.txt openai

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Run tests
        run: pytest -q
