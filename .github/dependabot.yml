version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # O SDK da Anthropic remove parâmetros entre majors — foi o que quebrou o
      # ClaudeModel quando sampling params deixaram de ser aceitos. Subir junto
      # com a revisão do provider, não por PR automático.
      - dependency-name: "anthropic"
        update-types:
          - "version-update:semver-major"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
